name: Publicar O Vazio Convergencia

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos essenciais
        run: |
          test -f index.html
          test -f editor.html
          test -f duelo.html
          test -f site.js
          test -d assets
      - name: Preparar pacote integral do site
        run: |
          mkdir -p _site
          cp index.html editor.html duelo.html site.js _site/
          cp -R assets _site/assets
          if [ -d site ]; then cp -R site/. _site/; fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
